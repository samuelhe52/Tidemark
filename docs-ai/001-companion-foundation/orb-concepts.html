<!doctype html><meta charset="utf-8">
<body style="margin:0;background:#15161f">
<div id="orbs" style="display:flex;gap:24px;padding:24px;background:radial-gradient(120% 120% at 20% 0%,#3b3f63 0,#1b1c2b 60%,#111119 100%);width:560px">

<!-- A · Tide: liquid glass -->
<svg width="160" height="190" viewBox="0 0 160 190">
  <defs>
    <clipPath id="tA"><circle cx="80" cy="80" r="56"/></clipPath>
    <filter id="aurA" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.03" numOctaves="3" seed="7"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.85  0 0 0 0 1  0 0 0 1.6 -0.55"/>
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <linearGradient id="liqA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ef0e0"/><stop offset=".5" stop-color="#5b7cff"/><stop offset="1" stop-color="#2a1670"/></linearGradient>
    <radialGradient id="glassA" cx=".5" cy=".5" r=".5"><stop offset=".78" stop-color="#fff" stop-opacity="0"/><stop offset=".96" stop-color="#cfe8ff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity=".7"/></radialGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#6fd3ff" stop-opacity=".45"/><stop offset="1" stop-color="#6fd3ff" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="80" cy="80" r="78" fill="url(#glowA)"/>
  <g clip-path="url(#tA)">
    <rect x="20" y="20" width="120" height="120" fill="#141a3a" opacity=".55"/>
    <path d="M18 86 C 40 74, 58 98, 82 86 S 122 74, 142 88 L142 142 L18 142 Z" fill="url(#liqA)"/>
    <rect x="20" y="70" width="120" height="72" filter="url(#aurA)" opacity=".7"/>
    <path d="M18 86 C 40 74, 58 98, 82 86 S 122 74, 142 88" fill="none" stroke="#e8fffb" stroke-width="1.6" opacity=".85"/>
    <circle cx="62" cy="108" r="2" fill="#fff" opacity=".7"/><circle cx="96" cy="118" r="1.4" fill="#fff" opacity=".6"/><circle cx="84" cy="100" r="1" fill="#fff" opacity=".8"/>
  </g>
  <circle cx="80" cy="80" r="56" fill="url(#glassA)"/>
  <ellipse cx="60" cy="52" rx="18" ry="9" fill="#fff" opacity=".55" transform="rotate(-28 60 52)"/>
  <ellipse cx="104" cy="118" rx="10" ry="3" fill="#bff" opacity=".25" transform="rotate(-35 104 118)"/>
  <text x="80" y="176" fill="#cfcbe8" font: font-family="-apple-system" font-size="13" text-anchor="middle">Tide</text>
</svg>

<!-- B · Ember: plasma core + fireflies -->
<svg width="160" height="190" viewBox="0 0 160 190">
  <defs>
    <radialGradient id="coreB" cx=".42" cy=".4" r=".6"><stop offset="0" stop-color="#fff6e8"/><stop offset=".25" stop-color="#ffb26b"/><stop offset=".6" stop-color="#e0407a"/><stop offset="1" stop-color="#3a0f4f"/></radialGradient>
    <radialGradient id="haloB"><stop offset="0" stop-color="#ff7a59" stop-opacity=".55"/><stop offset="1" stop-color="#ff7a59" stop-opacity="0"/></radialGradient>
    <filter id="plasB"><feTurbulence type="turbulence" baseFrequency=".035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="10"/></filter>
    <filter id="glB"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>
  <circle cx="80" cy="80" r="76" fill="url(#haloB)"/>
  <circle cx="80" cy="80" r="44" fill="url(#coreB)" filter="url(#plasB)"/>
  <ellipse cx="80" cy="80" rx="64" ry="22" fill="none" stroke="#ffd2a8" stroke-opacity=".25" transform="rotate(-18 80 80)"/>
  <ellipse cx="80" cy="80" rx="58" ry="34" fill="none" stroke="#ffd2a8" stroke-opacity=".15" transform="rotate(40 80 80)"/>
  <g fill="#ffe9c2"><circle cx="22" cy="96" r="3" filter="url(#glB)"/><circle cx="22" cy="96" r="1.6"/><circle cx="136" cy="60" r="2.6" filter="url(#glB)"/><circle cx="136" cy="60" r="1.3"/><circle cx="110" cy="36" r="1.2"/><circle cx="50" cy="126" r="2" filter="url(#glB)"/><circle cx="50" cy="126" r="1"/></g>
  <text x="80" y="176" fill="#cfcbe8" font-family="-apple-system" font-size="13" text-anchor="middle">Ember</text>
</svg>

<!-- C · Iris: iridescent shell with a gaze -->
<svg width="160" height="190" viewBox="0 0 160 190">
  <defs>
    <clipPath id="cC"><circle cx="80" cy="80" r="54"/></clipPath>
    <linearGradient id="irC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ef7d8"/><stop offset=".35" stop-color="#8aa8ff"/><stop offset=".65" stop-color="#e29bff"/><stop offset="1" stop-color="#ffd59e"/></linearGradient>
    <filter id="filmC"><feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="40"/></filter>
    <radialGradient id="shadeC" cx=".38" cy=".32" r=".75"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#0b0820" stop-opacity=".75"/></radialGradient>
    <radialGradient id="pupC" cx=".45" cy=".4"><stop offset="0" stop-color="#2b1d5c"/><stop offset=".7" stop-color="#120b2b"/><stop offset="1" stop-color="#120b2b" stop-opacity=".2"/></radialGradient>
    <radialGradient id="haloC"><stop offset="0" stop-color="#b39bff" stop-opacity=".4"/><stop offset="1" stop-color="#b39bff" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="80" cy="80" r="76" fill="url(#haloC)"/>
  <g clip-path="url(#cC)">
    <rect x="10" y="10" width="140" height="140" fill="url(#irC)" filter="url(#filmC)"/>
    <ellipse cx="94" cy="84" rx="17" ry="20" fill="url(#pupC)"/>
    <circle cx="99" cy="77" r="4" fill="#fff" opacity=".9"/>
    <circle cx="80" cy="80" r="54" fill="url(#shadeC)"/>
  </g>
  <ellipse cx="62" cy="50" rx="16" ry="7" fill="#fff" opacity=".5" transform="rotate(-30 62 50)"/>
  <text x="80" y="176" fill="#cfcbe8" font-family="-apple-system" font-size="13" text-anchor="middle">Iris</text>
</svg>
</div>
</body>
